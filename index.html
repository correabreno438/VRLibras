<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LIBRAS VR - MVP</title>
  <style>
    :root {
      --avatar-width: 240px;
      --avatar-height: 320px;
      --avatar-zoom: 1;
      --avatar-pan-y: 0%;
      --avatar-filter: none;
    }

    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    * { box-sizing: border-box; }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      background: #000;
    }

    .eye {
      position: relative;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .eye video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #stage.mono #eyeLeft { width: 100%; }
    #stage.mono #eyeRight { display: none; }

    #stage.stereo #eyeLeft,
    #stage.stereo #eyeRight {
      width: 50%;
      border-left: 1px solid #000;
    }

    button {
      font-family: system-ui, sans-serif;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: rgba(25, 25, 30, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: transform 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }
    button:active { transform: scale(0.95); }

    #micBtn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 40;
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      font-size: 20px;
      background: linear-gradient(145deg, #ff6b6b, #e63946);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 4px 18px rgba(230,57,70,0.45);
    }
    #micBtn.listening {
      background: linear-gradient(145deg, #3ddfc6, #2a9d8f);
      box-shadow: 0 4px 18px rgba(42,157,143,0.45);
    }

    #status {
      position: fixed;
      top: 20px;
      left: 72px;
      z-index: 30;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      background: rgba(25,25,30,0.5);
      backdrop-filter: blur(6px);
      padding: 6px 12px;
      border-radius: 999px;
      max-width: 50vw;
    }

    #toggleStereoBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 30;
    }

    #vlibras-container {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 25;
      width: var(--avatar-width);
      height: var(--avatar-height);
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      filter: var(--avatar-filter);
    }
    #vlibras-container canvas {
      width: 100% !important;
      height: 100% !important;
      transform: scale(var(--avatar-zoom)) translateY(var(--avatar-pan-y));
      transform-origin:center;
    }

    #captionBar {
      position: fixed;
      left: 50%;
      bottom: 6%;
      transform: translateX(-50%);
      z-index: 20;
      width: max-content;
      max-width: min(85vw, 640px);
      padding: 10px 20px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      font-size: clamp(16px, 2.8vw, 28px);
      line-height: 1.3;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }
    #captionBar:empty { display: none; }

    @media (max-width: 480px) {
      :root {
        --avatar-width: 150px;
        --avatar-height: 200px;
      }
      #micBtn { width: 44px; height: 44px; font-size: 18px; }
      #status { font-size: 10px; max-width: 42vw; padding: 5px 10px; }
      #toggleStereoBtn { font-size: 11px; padding: 8px 12px; }
      #captionBar { max-width: 90vw; font-size: clamp(14px, 4vw, 20px); }
    }
  </style>
</head>
<body>

  <div id="stage" class="mono">
    <div class="eye" id="eyeLeft"><video autoplay playsinline muted></video></div>
    <div class="eye" id="eyeRight"><video autoplay playsinline muted></video></div>
  </div>

  <button id="micBtn" title="Falar">🎤</button>
  <div id="status">Carregando câmera...</div>
  <button id="toggleStereoBtn">🥽 Modo VR</button>

  <div id="vlibras-container"></div>

  <div id="captionBar">Toque no microfone para começar</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
